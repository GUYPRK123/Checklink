[pytest]
# ให้ import แพ็กเกจ analyzer จากโฟลเดอร์ backend ได้ตรง ๆ โดยไม่ต้องตั้ง PYTHONPATH เอง
# ../sandbox ต่อท้ายไว้เพื่อให้เทสต์ sandbox_server รันรวมกับชุดอื่นด้วยคำสั่งเดียว
# (sandbox_server import playwright แบบ lazy จึงเทสต์ได้โดยไม่ต้องติดตั้ง Chromium)
pythonpath = . ../sandbox
testpaths = tests
# -q สั้น, --strict-markers กัน marker พิมพ์ผิดแล้วเงียบหาย
addopts = -q --strict-markers
