# ============================================================================
# deploy/nginx.conf — ตัวอย่าง reverse proxy สำหรับ Checklink
#
# ทำไมต้องมี Nginx คั่นหน้า: waitress ไม่ได้ออกแบบมาให้รับทราฟฟิกจากอินเทอร์เน็ต
# ตรง ๆ และไม่รองรับ HTTPS เอง Nginx จึงรับหน้าที่ TLS + จำกัดขนาด request +
# เสิร์ฟไฟล์ static ให้เร็วขึ้น แล้วส่งต่อไปที่ waitress บน 127.0.0.1:5000
#
# วิธีติดตั้ง (เจ้าของเครื่องต้องรันเอง — Claude รันคำสั่งระดับระบบให้ไม่ได้
# ให้พิมพ์ `! <คำสั่ง>` ในช่องแชทถ้าอยากให้ผลออกมาในบทสนทนา):
#
#   sudo cp /home/url/checkurl-app/Checklink/deploy/nginx.conf \
#           /etc/nginx/sites-available/checklink
#   sudo ln -s /etc/nginx/sites-available/checklink /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ เมื่อเปลี่ยนมาใช้ Nginx แล้ว ต้องแก้ .env ด้วย 3 บรรทัด:
#     BEHIND_PROXY=true          (ไม่งั้น rate limit จะเห็นทุกคนเป็น 127.0.0.1 คนเดียวกัน)
#     CORS_ORIGINS=<origin จริงที่ผู้ใช้เปิด>
#     SESSION_COOKIE_SECURE=true (ตั้งได้ "หลัง" มี HTTPS แล้วเท่านั้น)
#   และเปลี่ยน waitress ให้ผูก 127.0.0.1 แทน 0.0.0.0 (ดู phishing-checker.service)
#   ไม่งั้นคนภายนอกยังยิงตรงเข้าพอร์ต 5000 ข้าม Nginx ได้อยู่ดี
# ============================================================================

server {
    listen 80;
    listen [::]:80;

    # เปลี่ยนเป็นชื่อโดเมนจริงเมื่อมีแล้ว (จำเป็นสำหรับ certbot)
    server_name 198.199.122.176;

    # ---- ขอใบรับรอง HTTPS ฟรีจาก Let's Encrypt ----
    # ต้องมี "ชื่อโดเมนจริง" ก่อน (certbot ออกใบรับรองให้เลข IP ไม่ได้)
    # เมื่อมีโดเมนแล้วรัน:  sudo certbot --nginx -d ชื่อโดเมนของคุณ
    # certbot จะเติมบล็อก listen 443 + redirect http->https ให้ไฟล์นี้เอง

    client_max_body_size 2m;   # เผื่อรูป QR ที่อัปโหลด — ไม่ต้องมากกว่านี้

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # 3 บรรทัดนี้คู่กับ BEHIND_PROXY=true ในแอป เพื่อให้เห็น IP ผู้ใช้จริง
        # (ใช้ทำ rate limit) และรู้ว่า request เดิมเป็น https หรือไม่ (ใช้ตัดสิน HSTS)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # การตรวจเชิงลึกชั้นที่ 3-4 ต้องรอเน็ตปลายทางจริง จึงช้ากว่า default 60s ได้
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
